name: Vérification KidSorties
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'event-core.mjs'
      - 'event-core.test.mjs'
      - 'smoke.test.mjs'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'package.json'
      - '.github/workflows/tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tests application et PWA
        run: npm test
