name: Collecte des événements
on:
  push:
    branches: [main]
    paths:
      - 'collect.mjs'
      - 'collect-paris.mjs'
      - 'collect-essonne.mjs'
      - 'collect-familinparis.mjs'
      - 'family-filter.mjs'
      - 'summarize.mjs'
      - '.github/workflows/collect.yml'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
concurrency:
  group: kidsorties-data-collection
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collecte OpenAgenda
        run: npm run collect
        env:
          OPENAGENDA_API_KEY: ${{ secrets.OPENAGENDA_API_KEY }}
          OPENAGENDA_AGENDAS: ${{ vars.OPENAGENDA_AGENDAS }}
      - name: Collecte spectacles Paris Data
        run: node collect-paris.mjs
        continue-on-error: true
      - name: Collecte des sorties Essonne Tourisme
        run: node collect-essonne.mjs
        continue-on-error: true
      - name: Collecte complémentaire FamilinParis
        run: node collect-familinparis.mjs
        continue-on-error: true
      - name: Créer les résumés IA (si configuré)
        run: node summarize.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Enregistrer les événements
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/events.json data/paris.json data/summary-cache.json
          if [ -f data/essonne.json ]; then git add data/essonne.json; fi
          if [ -f data/familinparis.json ]; then git add data/familinparis.json; fi
          git diff --cached --quiet || (git commit -m 'Actualisation des sorties' && git pull --rebase origin main && git push origin HEAD:main)
