name: Collecte des événements
on:
  push:
    branches: [main]
    paths:
      - 'collect.mjs'
      - '.github/workflows/collect.yml'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run collect
        env:
          OPENAGENDA_API_KEY: ${{ secrets.OPENAGENDA_API_KEY }}
          OPENAGENDA_AGENDAS: ${{ vars.OPENAGENDA_AGENDAS }}
      - name: Enregistrer les événements
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/events.json
          git diff --cached --quiet || (git commit -m 'Actualisation des sorties' && git push)
